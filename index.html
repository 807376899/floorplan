<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>实验室布局维护系统</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script defer src="./js/domain.js"></script>
    <script defer src="./js/render.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand">
          <h1>实验室布局维护系统</h1>
          <p>围绕当前楼层与空间直接查看、维护实验室分布，需要时再切换到方案对比。</p>
        </div>
        <div class="controls">
          <label class="file-control">
            <span>导入数据包</span>
            <input id="packageFileInput" type="file" accept=".xlsx,.xls,.json" />
          </label>
          <button id="loadSampleBtn" type="button">加载示例数据</button>
          <button id="downloadTemplateBtn" type="button">下载模板</button>
          <button id="exportWorkbookBtn" type="button">导出当前数据包</button>
        </div>
      </section>

      <section class="filters">
        <label>教学楼<select id="buildingSelect"></select></label>
        <label>楼层<select id="floorSelect"></select></label>
        <label>学院高亮<select id="collegeSelect"></select></label>
        <div id="planCompareFilters" class="plan-filter-group">
          <label>对比前方案<select id="beforePlanSelect"></select></label>
          <label>对比后方案<select id="afterPlanSelect"></select></label>
        </div>
      </section>

      <section class="status-row">
        <div id="statusText">正在加载示例数据...</div>
        <div id="legend" class="legend"></div>
      </section>

      <section class="workspace">
        <div class="visual-stage">
          <aside class="compare-panel">
            <div class="compare-heading">
              <div>
                <span id="planModeBadge" class="mode-badge">单方案维护</span>
                <h2 id="comparePanelTitle">缩略图</h2>
                <p id="comparePanelHint"></p>
              </div>
              <div class="compare-heading-actions">
                <button id="newPlanBtn" type="button">新增方案</button>
                <button id="deletePlanBtn" type="button">删除方案</button>
              </div>
            </div>
            <div id="compareColumns" class="compare-columns is-single">
              <section id="beforeColumn" class="compare-column">
                <div class="compare-title compare-title-before">
                  <span id="beforePlanName"></span>
                </div>
                <div id="beforeThumbs" class="floor-thumbs"></div>
              </section>
              <section id="afterColumn" class="compare-column is-hidden">
                <div class="compare-title compare-title-after">
                  <span id="afterPlanName"></span>
                </div>
                <div id="afterThumbs" class="floor-thumbs"></div>
              </section>
            </div>
          </aside>

          <div class="canvas-panel">
            <div class="canvas-toolbar">
              <div class="canvas-meta">
                <strong id="activePlanBadge">当前主图</strong>
                <span id="canvasModeText">适配显示</span>
              </div>
              <div>
                <button id="fitCanvasBtn" type="button">适配</button>
                <button id="zoomOutBtn" type="button" title="缩小">-</button>
                <button id="zoomInBtn" type="button" title="放大">+</button>
              </div>
            </div>
            <div id="floorplan" class="floorplan is-fit"></div>
          </div>
        </div>

        <aside class="details">
          <div id="roomDetails" class="room-details">点击主图中的空间，在这里查看当前方案下的空间、实验室和分配信息。</div>
        </aside>
      </section>

      <section class="data-panel">
        <div class="panel-heading">
          <div>
            <h2>高级数据编辑</h2>
            <p>右侧适合高频查看当前选中对象；底部表格保留为批量修正和结构性调整入口。</p>
          </div>
          <div id="editorTabs" class="editor-tabs"></div>
          <div class="editor-actions">
            <button id="addRowBtn" type="button">新增行</button>
            <button id="applyTableBtn" type="button">应用修改</button>
            <button id="downloadSheetBtn" type="button">导出当前表</button>
          </div>
        </div>
        <div id="dataEditor" class="data-editor"></div>
      </section>
    </main>

    <div id="unsavedModal" class="modal-backdrop is-hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="unsavedModalTitle">
        <h3 id="unsavedModalTitle">有未保存的搬迁内容</h3>
        <p id="unsavedModalText">右侧搬迁表单里还有未保存内容。继续前请选择保存、放弃，或返回继续编辑。</p>
        <div class="modal-actions">
          <button id="unsavedSaveContinueBtn" type="button">保存并继续</button>
          <button id="unsavedDiscardContinueBtn" type="button">放弃修改并继续</button>
          <button id="unsavedStayBtn" type="button">返回编辑</button>
        </div>
      </div>
    </div>

    <div id="deletePlanModal" class="modal-backdrop is-hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="deletePlanModalTitle">
        <h3 id="deletePlanModalTitle">删除当前方案</h3>
        <p id="deletePlanModalText">删除后，这个方案下的全部分配关系也会一并删除。</p>
        <div class="modal-actions">
          <button id="confirmDeletePlanBtn" type="button" class="primary-button">确认删除</button>
          <button id="cancelDeletePlanBtn" type="button">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
